<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Cricket Score logo: a ball with its seam and a "live" signal. Brand colours from @rajesh-hub/tokens
       (navy #17365D, brand-blue #2F75B5, teal #008C95, gold #D99A2B). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17365D"/>
      <stop offset="1" stop-color="#2F75B5"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="232" cy="292" r="146"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- ball -->
  <circle cx="232" cy="292" r="146" fill="#FFFFFF"/>
  <g clip-path="url(#ball)" fill="none" stroke="#D99A2B" stroke-linecap="round">
    <path d="M186 140 C 240 214, 240 370, 186 444" stroke-width="12"/>
    <path d="M222 138 C 278 212, 278 372, 222 446" stroke-width="12"/>
    <g stroke-width="7">
      <path d="M200 186 l 26 -4"/><path d="M212 226 l 28 -2"/><path d="M216 266 l 28 0"/>
      <path d="M216 312 l 28 0"/><path d="M212 354 l 28 2"/><path d="M200 396 l 26 4"/>
    </g>
  </g>
  <!-- live signal -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="20">
    <path d="M388 76 A 54 54 0 0 1 442 130"/>
    <path d="M388 36 A 94 94 0 0 1 482 130" opacity="0.55"/>
  </g>
  <circle cx="388" cy="130" r="22" fill="#008C95" stroke="#FFFFFF" stroke-width="8"/>
</svg>
